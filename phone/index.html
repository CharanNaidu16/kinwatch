<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kinwatch camera</title>
<style>
  :root { --bg:#101214; --fg:#f2f2f2; --muted:#9aa0a6; --ok:#2e9d5b; --warn:#d99a1e; --bad:#d64545; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:16px; text-align:center; }
  h1 { font-size:22px; margin:0; }
  .hint { color:var(--muted); max-width:30em; }
  button { font:inherit; border:0; border-radius:12px; padding:14px 22px; cursor:pointer; }
  #start { background:var(--ok); color:#fff; font-size:20px; padding:18px 34px; }
  #preview { width:100%; max-width:480px; border-radius:12px; background:#000; display:none; }
  #status { display:none; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:#1d2125; }
  #dot { width:12px; height:12px; border-radius:50%; background:var(--muted); }
  .ok #dot { background:var(--ok); } .warn #dot { background:var(--warn); } .bad #dot { background:var(--bad); }
  #details { color:var(--muted); font-size:14px; display:none; }
  #error { color:#ffb4b4; max-width:30em; display:none; }
  #hint { color:#ffd27a; max-width:30em; display:none; font-size:14px; }
  #dimBtn, #rotateBtn { background:#2a2f34; color:var(--fg); display:none; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #dim { position:fixed; inset:0; background:#000; display:none; z-index:10; }
  #dim span { position:absolute; right:14px; bottom:14px; width:8px; height:8px; border-radius:50%; background:var(--ok); opacity:.6; }
</style>
</head>
<body>
<main>
  <h1>Kinwatch camera · कैमरा</h1>
  <p class="hint" id="intro">Put this phone where it can see the room, plug it in, then tap Start.<br>
    फ़ोन को ऐसी जगह रखें जहाँ से कमरा दिखे, चार्जर लगाएँ, फिर Start दबाएँ।</p>
  <button id="start">Start watching · शुरू करें</button>
  <video id="preview" playsinline muted autoplay></video>
  <div id="status"><span id="dot"></span><span id="statusText"></span></div>
  <div id="details"></div>
  <p id="error"></p>
  <p id="hint"></p>
  <div class="row">
    <button id="rotateBtn" title="Rotate the picture">↻ Rotate · घुमाएँ</button>
    <button id="dimBtn">Dim screen · स्क्रीन धीमी करें</button>
  </div>
</main>
<div id="dim" title="Tap to wake"><span></span></div>
<canvas id="canvas" hidden></canvas>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const TARGET_WIDTH = 640, JPEG_QUALITY = 0.7;
const BACKOFF_MS = [1500, 3000, 6000, 12000, 30000];

function readToken() {
  const fromUrl = new URLSearchParams(location.search).get("d");
  if (fromUrl) {
    try { localStorage.setItem("kinwatch_device", fromUrl); } catch (e) {}
    // Keep the token off the screen (and out of any screen recording).
    history.replaceState(null, "", location.pathname);
    return fromUrl;
  }
  try { return localStorage.getItem("kinwatch_device"); } catch (e) { return null; }
}

const token = readToken();
let stream = null, track = null, wakeLock = null;
let intervalMs = 1500, failures = 0, inFlight = false, timer = null;
let lastOk = null, armedRules = 0;
let lastVideoTime = -1, stuckTicks = 0, restarting = false;
const FROZEN_TICKS = 4;  // the video clock hasn't moved for this many uploads: reopen the camera
let rotation = 0;  // degrees clockwise applied to uploaded frames (for phones with auto-rotate off)
try { rotation = parseInt(localStorage.getItem("kinwatch_rotation") || "0", 10) || 0; } catch (e) {}

function applyRotationPreview() {
  $("preview").style.transform = rotation ? `rotate(${rotation}deg)` : "";
}

function setStatus(kind, text) {
  $("status").className = kind;
  $("status").style.display = "flex";
  $("statusText").textContent = text;
}
function showError(text) { $("error").textContent = text; $("error").style.display = text ? "block" : "none"; }
function updateDetails() {
  const ago = lastOk ? Math.round((Date.now() - lastOk) / 1000) + " s ago" : "never";
  $("details").textContent = `Last upload: ${ago} · Rules on: ${armedRules}`;
  $("details").style.display = "block";
}

function showHint(text) { $("hint").textContent = text; $("hint").style.display = text ? "block" : "none"; }

// Telegram's and other apps' built-in browsers pause the camera when you switch away and often can't
// keep the screen on, which looks like "the camera got stuck".
function inAppBrowser() {
  const ua = navigator.userAgent || "";
  return Boolean(window.TelegramWebviewProxy) || /Telegram|FBAN|FBAV|Instagram|; wv\)/i.test(ua);
}

function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} });
  stream = null; track = null;
}

async function restartCamera(reason) {
  if (restarting) return;
  restarting = true;
  setStatus("warn", "Reopening camera · कैमरा फिर से खुल रहा है");
  try { stopCamera(); await startCamera(); lastVideoTime = -1; stuckTicks = 0; }
  catch (e) { retryCamera(); }
  finally { restarting = false; }
}

async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
  track = stream.getVideoTracks()[0];
  track.addEventListener("ended", () => { setStatus("bad", "Camera stopped · कैमरा बंद"); restartCamera("ended"); });
  $("preview").srcObject = stream;
  $("preview").style.display = "block";
  await $("preview").play().catch(() => {});
}

function retryCamera() {
  setTimeout(async () => {
    try { await startCamera(); setStatus("ok", "Watching · नज़र रख रहा है"); }
    catch (e) { retryCamera(); }
  }, 10000);
}

async function keepAwake() {
  if (!("wakeLock" in navigator)) {
    showHint("This browser can't keep the screen on. Set the phone's screen timeout to the maximum, or open the link in Chrome.");
    return;
  }
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { /* low battery or not allowed */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || $("start").style.display !== "none") return;
  // Back from the background: the camera may have been stopped and timers throttled.
  keepAwake();
  if (!track || track.readyState === "ended") restartCamera("resume");
  schedule(0);
});

function checkFrozen() {
  const v = $("preview");
  if (v.paused) v.play().catch(() => {});
  if (!track || track.readyState === "ended") { restartCamera("ended"); return true; }
  stuckTicks = v.currentTime === lastVideoTime ? stuckTicks + 1 : 0;
  lastVideoTime = v.currentTime;
  if (stuckTicks >= FROZEN_TICKS) { restartCamera("frozen"); return true; }
  return false;
}

function grab() {
  const v = $("preview");
  if (!v.videoWidth) return Promise.resolve(null);
  const scale = Math.min(1, TARGET_WIDTH / Math.max(v.videoWidth, v.videoHeight));
  const w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
  const sideways = rotation === 90 || rotation === 270;
  const c = $("canvas");
  c.width = sideways ? h : w;
  c.height = sideways ? w : h;
  const ctx = c.getContext("2d");
  ctx.save();
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.drawImage(v, -w / 2, -h / 2, w, h);
  ctx.restore();
  return new Promise((resolve) => c.toBlob(resolve, "image/jpeg", JPEG_QUALITY));
}

function schedule(ms) {
  clearTimeout(timer);
  timer = setTimeout(tick, ms);
}

async function tick() {
  if (inFlight) return schedule(intervalMs);  // latest frame wins; never queue uploads
  inFlight = true;
  try {
    if (restarting || checkFrozen()) { schedule(1000); return; }  // don't upload a stale picture
    const blob = await grab();
    if (!blob) { schedule(500); return; }
    const res = await fetch("/api/frame", {
      method: "POST", body: blob, cache: "no-store",
      headers: { "Content-Type": "image/jpeg", "X-Device-Token": token, "X-Captured-At": String(Date.now()) },
    });
    if (res.status === 401) {
      setStatus("bad", "Wrong camera link · लिंक गलत है");
      showError("Open the camera link Kinwatch sent you again.");
      return;  // stop: retrying with a bad token won't help
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const body = await res.json();
    failures = 0;
    lastOk = Date.now();
    intervalMs = body.next_interval_ms || 1500;
    armedRules = body.armed_rules || 0;
    setStatus("ok", body.dark ? "Watching (too dark) · बहुत अंधेरा" : "Watching · नज़र रख रहा है");
    showError("");
    schedule(intervalMs);
  } catch (e) {
    failures += 1;
    const base = BACKOFF_MS[Math.min(failures - 1, BACKOFF_MS.length - 1)];
    setStatus("warn", "Offline, retrying · दोबारा कोशिश");
    schedule(base * (0.8 + Math.random() * 0.4));
  } finally {
    inFlight = false;
    updateDetails();
  }
}

$("start").addEventListener("click", async () => {
  if (!token) { showError("This link is missing its camera code. Open the link Kinwatch sent you."); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("This browser can't use the camera. Open the link in Chrome."); return;
  }
  $("start").disabled = true;
  try {
    await startCamera();
  } catch (e) {
    $("start").disabled = false;
    showError(e && e.name === "NotAllowedError"
      ? "Camera blocked. Tap the lock icon in the address bar → Camera → Allow, then tap Start again. " +
        "कैमरा की अनुमति दें: पता बार में ताले के निशान पर टैप करें → Camera → Allow."
      : "Couldn't open the camera: " + (e && e.message ? e.message : e));
    setStatus("bad", "Camera blocked · कैमरा बंद");
    return;
  }
  $("start").style.display = "none";
  $("intro").style.display = "none";
  $("dimBtn").style.display = "inline-block";
  $("rotateBtn").style.display = "inline-block";
  applyRotationPreview();
  setStatus("ok", "Starting · शुरू हो रहा है");
  if (inAppBrowser()) {
    showHint("You're in an app's built-in browser, which pauses the camera. For reliable watching, open this " +
             "link in Chrome (⋮ menu → Open in browser).");
  }
  await keepAwake();
  tick();
  setInterval(updateDetails, 5000);
});

$("dimBtn").addEventListener("click", () => { $("dim").style.display = "block"; });
$("rotateBtn").addEventListener("click", () => {
  rotation = (rotation + 90) % 360;
  try { localStorage.setItem("kinwatch_rotation", String(rotation)); } catch (e) {}
  applyRotationPreview();
});
$("dim").addEventListener("click", () => { $("dim").style.display = "none"; });
</script>
</body>
</html>
