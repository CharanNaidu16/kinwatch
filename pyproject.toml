[project]
name = "kinwatch"
version = "0.1.0"
description = "Turn any old phone into a camera your family programs by just telling it."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
